name: Enable Swipe Navigation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/enable-swipe.yml'
      - 'swipe.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add swipe script to app pages
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script src="swipe.js"></script>'
          for name in ['app.html','index.html','admin.html']:
              p = Path(name)
              text = p.read_text()
              if tag not in text:
                  text = text.replace('</body>', tag + '</body>')
                  p.write_text(text)
          PY
      - name: Commit swipe support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html index.html admin.html
          git diff --cached --quiet || git commit -m "Enable swipe navigation across phone app"
          git push
