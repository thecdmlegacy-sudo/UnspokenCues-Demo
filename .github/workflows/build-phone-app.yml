name: Build Phone + Wear Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'phone-app/**'
      - '.github/workflows/build-phone-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone and watch
        working-directory: phone-app
        run: |
          gradle :app:assembleDebug :app:bundleRelease --stacktrace
          gradle :wear:assembleDebug :wear:bundleRelease --stacktrace
      - name: Rename outputs
        run: |
          cp phone-app/app/build/outputs/apk/debug/app-debug.apk Unspoken-Cues-Phone-v27.apk
          cp phone-app/app/build/outputs/bundle/release/app-release.aab Unspoken-Cues-Phone-v27-UNSIGNED.aab
          cp phone-app/wear/build/outputs/apk/debug/wear-debug.apk Unspoken-Cues-Watch-v2.apk
          cp phone-app/wear/build/outputs/bundle/release/wear-release.aab Unspoken-Cues-Watch-v2-UNSIGNED.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Unspoken-Cues-Phone-v27-Watch-v2
          path: |
            Unspoken-Cues-Phone-v27.apk
            Unspoken-Cues-Phone-v27-UNSIGNED.aab
            Unspoken-Cues-Watch-v2.apk
            Unspoken-Cues-Watch-v2-UNSIGNED.aab
      - name: Publish latest APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phone-app-latest --cleanup-tag -y || true
          gh release create phone-app-latest Unspoken-Cues-Phone-v27.apk Unspoken-Cues-Watch-v2.apk --title 'Unspoken Cues Phone v27 + Watch v2' --notes 'Updated companion and Wear OS build. Watch v2 adds higher-contrast availability colors, black text on yellow, darker purple, larger status controls, selected-state check marks, persistent status, visible Screen Lock, locked-control protection, Instant Cue-Out, haptic confirmation, debounce protection, connection checks, bidirectional status/cue sync, and version display. Phone v27 reports real watch connection state and improves watch cue syncing.'
