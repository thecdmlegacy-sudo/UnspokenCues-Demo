name: Build Phone App

on:
  push:
    branches: [ main ]
    paths:
      - 'phone-app/**'
      - '.github/workflows/build-phone-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: phone-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp phone-app/app/build/outputs/apk/debug/app-debug.apk Unspoken-Cues-Phone-v2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Unspoken-Cues-Phone-v2
          path: Unspoken-Cues-Phone-v2.apk
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phone-app-latest --cleanup-tag -y || true
          gh release create phone-app-latest Unspoken-Cues-Phone-v2.apk --title 'Unspoken Cues Phone App v2' --notes 'Premium phone app build.'
