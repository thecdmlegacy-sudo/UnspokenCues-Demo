<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unspoken Cues Admin</title><style>body{margin:0;background:#0a0810;color:#fff;font-family:system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:24px}h1{margin-top:0}.card{background:#15111a;border:1px solid #33283b;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}label{font-size:12px;color:#aaa3b2}input,textarea,select{width:100%;box-sizing:border-box;background:#0d0a11;color:#fff;border:1px solid #44364f;border-radius:12px;padding:12px}textarea{min-height:92px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#fff;color:#111;font-weight:800;margin-top:12px}.muted{color:#aaa3b2;font-size:12px}.ok{color:#45e184}.bad{color:#ff6b6b}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Unspoken Cues Admin</h1><p class="muted">Changes save to the same GitHub data file used by the public QR profile.</p><section class="card"><div class="field"><label>GitHub token</label><input id="token" type="password" placeholder="Fine-grained token with Contents: Read and write"></div><p class="muted">Token stays in this browser session only and is never saved into the site.</p></section><section class="card"><div class="grid"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Status</label><select id="status"><option value="available">Available</option><option value="maybe">Maybe / Slow</option><option value="no">Not Available</option><option value="private">Private Time</option></select></div></div><div class="field"><label>Tagline</label><input id="tagline"></div><div class="field"><label>Bio</label><textarea id="bio"></textarea></div><div class="field"><label>Preferences (comma separated)</label><input id="preferences"></div><div class="field"><label>Boundaries (comma separated)</label><input id="boundaries"></div></section><section class="card"><div class="field"><label>S.W.A.P. Cards Facebook</label><input id="facebookSwap"></div><div class="field"><label>Our LS Facebook</label><input id="facebookLS"></div></section><section class="card"><div class="grid"><div class="field"><label>Card number</label><input id="cardNumber"></div><div class="field"><label>Card title</label><input id="cardTitle"></div></div><div class="field"><label>Card tagline</label><input id="cardTagline"></div><div class="field"><label>Profile image filename</label><input id="profileImage" placeholder="cd-card.png"></div><div class="field"><label>Card image filename</label><input id="cardImage" placeholder="cd-card.png"></div><div class="field"><label>Unspoken Cues logo filename</label><input id="unspokenLogo" placeholder="unspoken-cues-logo.png"></div><div class="field"><label>S.W.A.P. logo filename</label><input id="swapLogo" placeholder="swap-logo.png"></div></section><button onclick="save()">Save Live Profile</button><p id="msg" class="muted"></p></main><script>
const owner='thecdmlegacy-sudo',repo='UnspokenCues-Demo',path='profile.json';let sha='';let data={};
async function load(){const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok){msg('Could not load profile',false);return}const j=await r.json();sha=j.sha;data=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));for(const k of Object.keys(data)){const e=document.getElementById(k);if(!e)continue;if(Array.isArray(data[k]))e.value=data[k].join(', ');else e.value=data[k]??''}}
function msg(t,ok){const e=document.getElementById('msg');e.textContent=t;e.className=ok?'ok':'bad'}
async function save(){const token=document.getElementById('token').value.trim();if(!token){msg('Enter GitHub token first',false);return}const out={...data,name:name.value.trim(),status:status.value,tagline:tagline.value.trim(),bio:bio.value.trim(),preferences:preferences.value.split(',').map(x=>x.trim()).filter(Boolean),boundaries:boundaries.value.split(',').map(x=>x.trim()).filter(Boolean),facebookSwap:facebookSwap.value.trim(),facebookLS:facebookLS.value.trim(),cardNumber:cardNumber.value.trim(),cardTitle:cardTitle.value.trim(),cardTagline:cardTagline.value.trim(),profileImage:profileImage.value.trim(),cardImage:cardImage.value.trim(),unspokenLogo:unspokenLogo.value.trim(),swapLogo:swapLogo.value.trim(),updatedAt:new Date().toISOString()};const content=btoa(unescape(encodeURIComponent(JSON.stringify(out,null,2))));const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Update live profile from admin',content,sha})});if(!r.ok){msg('Save failed. Check token permissions.',false);return}const j=await r.json();sha=j.content.sha;data=out;msg('Saved. Public QR profile will update after GitHub Pages deploys.',true)}load();
</script></body></html>
