<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08070b"><title>Unspoken Cues Profile</title><style>:root{color-scheme:dark;--bg:#08070b;--line:#33283b;--text:#fff;--muted:#aaa3b2;--green:#20e676;--yellow:#ffd84a;--red:#ff4d55;--purple:#a855f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#321744,transparent 35%),linear-gradient(#09070c,#050507);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}.shell{width:min(100%,560px);margin:auto;padding:20px 16px 60px}.brand{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;letter-spacing:.16em}.brand img{max-height:34px;max-width:145px;object-fit:contain}.ucText{color:#d9b6ff}.swapText{border:1px solid #9a6e36;color:#f1cc8c;padding:5px 8px;border-radius:7px}.hero{text-align:center;margin-top:28px}.avatar{width:138px;height:138px;margin:auto;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,#33283d,#151119);border:2px solid #a855f7;box-shadow:0 0 45px #7c3aed55;font-size:40px;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}h1{font-size:38px;margin:14px 0 0}.tag{color:#c9a0f5;margin-top:4px}.bio{color:#d2cbd7;line-height:1.55;max-width:430px;margin:13px auto}.live{display:inline-flex;align-items:center;gap:9px;border:1px solid #334238;background:#101914;padding:10px 15px;border-radius:999px;font-weight:800}.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 13px var(--green)}.section{margin-top:28px}.section h2{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:#d8d1dc}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border:1px solid var(--line);background:#17131c;border-radius:999px;font-size:13px}.card{position:relative;overflow:hidden;min-height:245px;border-radius:28px;padding:22px;background:radial-gradient(circle at 82% 14%,#d063f35c,transparent 29%),linear-gradient(135deg,#15111b,#25132f 48%,#76278b);border:1px solid #7e478d}.card.image{padding:0;background:#111}.card.image img{width:100%;height:100%;display:block;object-fit:cover}.cardtop{display:flex;justify-content:space-between}.logo{font-weight:950;font-size:21px;letter-spacing:.13em}.no{font-size:11px;color:#e0c6e5}.cardmain{position:absolute;bottom:25px}.cardmain b{display:block;font-size:28px}.cardmain span{color:#dfd0e3}.actions,.socials{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}button,a.btn{border:1px solid #3b3043;background:#17131d;color:#fff;border-radius:15px;padding:14px 10px;font-weight:800;text-decoration:none;text-align:center}.primary{background:#fff!important;color:#111!important}.collected{background:#302239!important;color:#e2c2ff!important}.footer{text-align:center;margin-top:36px;color:#837b89;font-size:11px}.footer img{max-height:42px;max-width:170px;object-fit:contain}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 15px;border-radius:999px;font-weight:800;display:none}.toast.show{display:block}@media(max-width:380px){.actions,.socials{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="brand"><div id="ucBrand"><span class="ucText">UNSPOKEN CUES</span></div><div id="swapBrand"><span class="swapText">S.W.A.P.</span></div></div><section class="hero"><div class="avatar" id="avatar">C&amp;D</div><h1 id="name">C&D</h1><div class="tag" id="tagline"></div><p class="bio" id="bio"></p><div class="live"><span class="dot" id="dot"></span><span id="statusText">Available</span></div></section><section class="section"><h2>Preferences</h2><div class="chips" id="preferences"></div></section><section class="section"><h2>Boundaries</h2><div class="chips" id="boundaries"></div></section><section class="section"><h2>My S.W.A.P. Card</h2><div class="card" id="card"><div class="cardtop"><span class="logo">S.W.A.P.</span><span class="no" id="cardNumber"></span></div><div class="cardmain"><b id="cardTitle"></b><span id="cardTagline"></span></div></div><div class="actions"><button id="collect" class="primary" onclick="collectCard()">Collect Our S.W.A.P. Card</button><button onclick="shareProfile()">Share Profile</button></div></section><section class="section"><h2>Connect</h2><div class="socials"><a id="fbSwap" class="btn" target="_blank" rel="noopener">S.W.A.P. Cards Facebook</a><a id="fbLS" class="btn" target="_blank" rel="noopener">Our LS Facebook</a></div></section><div class="footer"><div id="ucFooter">UNSPOKEN CUES</div><div style="margin:7px">featuring</div><div id="swapFooter"><span class="swapText">S.W.A.P.</span></div></div></main><div id="toast" class="toast"></div><script>
let profile={cardNumber:'001-F2',name:'C&D'};const statuses={available:['Available','#20e676'],maybe:['Maybe / Slow','#ffd84a'],no:['Not Available','#ff4d55'],private:['Private Time','#a855f7']};function chips(id,arr){document.getElementById(id).innerHTML=(arr||[]).map(x=>`<span class="chip">${String(x).replace(/[&<>]/g,'')}</span>`).join('')}function img(path,alt){const i=new Image();i.src=path;i.alt=alt;return i}async function load(){try{const r=await fetch('profile.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)return;profile=await r.json();name.textContent=profile.name||'C&D';tagline.textContent=profile.tagline||'';bio.textContent=profile.bio||'';chips('preferences',profile.preferences);chips('boundaries',profile.boundaries);fbSwap.href=profile.facebookSwap||'#';fbLS.href=profile.facebookLS||'#';cardNumber.textContent='#'+(profile.cardNumber||'');cardTitle.textContent=profile.cardTitle||'';cardTagline.textContent=profile.cardTagline||'';const s=statuses[profile.status]||statuses.available;statusText.textContent=s[0];dot.style.background=s[1];dot.style.boxShadow=`0 0 13px ${s[1]}`;if(profile.profileImage){avatar.innerHTML='';avatar.appendChild(img(profile.profileImage,profile.name+' profile photo'))}else avatar.textContent=profile.name||'C&D';if(profile.cardImage){card.className='card image';card.innerHTML='';card.appendChild(img(profile.cardImage,profile.cardTitle||'S.W.A.P. card'))}if(profile.unspokenLogo){ucBrand.innerHTML='';ucBrand.appendChild(img(profile.unspokenLogo,'Unspoken Cues'));ucFooter.innerHTML='';ucFooter.appendChild(img(profile.unspokenLogo,'Unspoken Cues'))}if(profile.swapLogo){swapBrand.innerHTML='';swapBrand.appendChild(img(profile.swapLogo,'S.W.A.P.'));swapFooter.innerHTML='';swapFooter.appendChild(img(profile.swapLogo,'S.W.A.P.'))}syncCollect()}catch(e){console.error(e)}}
const KEY='swap-binder';function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function collectCard(){let a=[];try{a=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}const n=profile.cardNumber||'001-F2';if(!a.includes(n))a.push(n);localStorage.setItem(KEY,JSON.stringify(a));syncCollect();toast('Added to your S.W.A.P. collection')}function syncCollect(){const n=profile.cardNumber||'001-F2';if((localStorage.getItem(KEY)||'').includes(n)){collect.textContent='Collected · '+n;collect.classList.remove('primary');collect.classList.add('collected')}}function shareProfile(){const u=location.href;if(navigator.share)navigator.share({title:(profile.name||'Profile')+' · Unspoken Cues',url:u});else navigator.clipboard.writeText(u).then(()=>toast('Profile link copied'))}load();
</script></body></html>
